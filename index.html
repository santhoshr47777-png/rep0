<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Note App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f4f7f6; }
        h2 { color: #333; text-align: center; }
        .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 20px; border: none; background-color: #5c6bc0; color: white; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #3f51b5; }
        .note-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .delete-btn { background-color: #e53935; padding: 6px 12px; font-size: 14px; }
        .delete-btn:hover { background-color: #c62828; }
    </style>
</head>
<body>
    <h2>📝 Quick Note Application</h2>
    <div class="input-area">
        <input type="text" id="noteInput" placeholder="Type a new note here...">
        <button onclick="addNote^(^)">Add Note</button>
    </div>
    <div id="notesContainer"></div>
    <script>
        const API_URL = '/notes';
        async function fetchNotes() {
            const res = await fetch(API_URL);
            const notes = await res.json();
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';
            notes.forEach(note => {
                const noteEl = document.createElement('div');
                noteEl.className = 'note-card';
                noteEl.innerHTML = `<span>${note.text}</span><button class="delete-btn" onclick="deleteNote^('${note.id}'^)">Delete</button>`;
                container.appendChild(noteEl);
            });
        }
        async function addNote() {
            const input = document.getElementById('noteInput');
            if (!input.value.trim()) return;
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: input.value })
            });
            input.value = '';
            fetchNotes();
        }
        async function deleteNote(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchNotes();
        }
        fetchNotes();
    </script>
</body>
</html>
